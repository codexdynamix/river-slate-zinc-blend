  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {

  .glow {
    position: absolute;

  }
  .glow-c {
    width: 560px;
    height: 360px;
    left: 50%;
    top: -150px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(177, 77, 255, 0.13) 0%, rgba(177, 77, 255, 0) 70%);
  }
  .net {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 630px;
    pointer-events: none;
  }
  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;

  .mark {

    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .rule {

    height: 3px;
    margin-top: 26px;
    border-radius: 99px;

  .kicker {

    font-weight: 600;

  .wave {

    width: 520px;
    height: 52px;

  .stripe {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
