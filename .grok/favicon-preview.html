<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #e8edf2; }
  .row { display: flex; gap: 24px; align-items: end; padding: 24px; background: #FFFFFF; }
  img { display: block; image-rendering: auto; }
  .box { background: #f2f4f7; padding: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="box"><img src="favicon.svg" width="16" height="16" alt=""></div>
    <div class="box"><img src="favicon.svg" width="32" height="32" alt=""></div>
    <div class="box"><img src="favicon.svg" width="64" height="64" alt=""></div>
    <div class="box" style="background:#101828"><img src="favicon.svg" width="32" height="32" alt=""></div>
  </div>
</body>
</html>
